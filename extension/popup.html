<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GemmaLens Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; padding: 16px; background: #F5F5F7; color: #1D1D1F; font-size: 13px; line-height: 1.4; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .brand { font-size: 14px; font-weight: 700; color: #1D1D1F; display: flex; align-items: center; gap: 6px; }
    .status { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(52, 199, 89, 0.12); color: #34C759; font-weight: 600; }
    .btn { width: 100%; background: #0071E3; color: white; border: none; padding: 10px; border-radius: 99px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s ease; }
    .btn:hover { background: #0077ED; }
    .card { background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 12px; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: none; }
    .card h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #1D1D1F; }
    .card p { font-size: 12px; color: #4B5563; line-height: 1.5; margin-bottom: 8px; }
    .loading { display: none; text-align: center; padding: 20px 0; font-size: 12px; color: #6E6E73; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(0,113,227,0.2); border-top-color: #0071E3; border-radius: 50%; margin: 0 auto 8px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-audio { background: #1D1D1F; color: white; border: none; padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">GemmaLens Companion</div>
    <div class="status" id="serverStatus">Local AI Ready</div>
  </div>

  <p style="color: #6E6E73; font-size: 12px; margin-bottom: 12px;">Capture this webpage to explain medical instructions, utility portals, or fine print in plain language.</p>

  <button class="btn" id="captureBtn">Explain This Web Page</button>

  <div class="loading" id="loadingBox">
    <div class="spinner"></div>
    <div>Analyzing page with Gemma 4 Vision...</div>
  </div>

  <div class="card" id="resultCard">
    <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: #0071E3; margin-bottom: 2px;" id="docCategory">Auto-Detected</div>
    <h4 id="docTitle">Webpage Analysis</h4>
    <p id="docSummary"></p>
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #F3F4F6; padding-top: 8px;">
      <button class="btn-audio" id="listenBtn">Read Aloud</button>
      <a href="http://localhost:3000" target="_blank" style="color: #0071E3; font-size: 11px; text-decoration: none; font-weight: 600;">Open GemmaLens &rarr;</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
